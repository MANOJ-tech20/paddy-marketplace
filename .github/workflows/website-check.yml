name: Paddy Market Website Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  website-check:
    runs-on: ubuntu-latest

    steps:
      - name: Download project code
        uses: actions/checkout@v4

      - name: Check website files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All website files exist!"

      - name: Validate HTML
        uses: html-validate/validate-action@v2
        with:
          files: "index.html"
